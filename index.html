<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NovelPress</title>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <div class="app">
    <aside class="panel panel-left" id="input-panel">
      <header class="panel-header">输入</header>
      <div class="panel-body" id="input-body"></div>
    </aside>

    <main class="panel panel-center" id="preview-panel">
      <header class="panel-header" id="preview-title">预览</header>
      <div class="panel-body" id="preview-body">
        
      </div>
    </main>

    <aside class="panel panel-right" id="format-panel">
      <header class="panel-header">格式 <button id="btn-export">导出 PDF</button></header>
      <div class="panel-body" id="format-body">
      </div>
    </aside>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@pdf-lib/fontkit@1.1.1/dist/fontkit.umd.min.js"></script>
  <script type="module" src="js/main.js"></script>
  <script type="module">
    import { mountExport } from './js/export/exportUI.js';
    mountExport(document.getElementById('btn-export'));
  </script>
</body>
</html>
